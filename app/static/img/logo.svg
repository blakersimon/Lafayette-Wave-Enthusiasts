<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Lafayette Wave Enthusiasts - Official Acadiana Flag &amp; Gulf Surf Crest Emblem">
  <defs>
    <!-- Circular Emblem Clip Path -->
    <clipPath id="emblemClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>

    <!-- Official Acadiana Flag Royal Blue Field (Top-Right Half: 3 White Fleurs-de-lis) -->
    <linearGradient id="acadianaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Official Acadiana Flag White Hoist Chevron (Left Triangle: Gold Star) -->
    <linearGradient id="acadianaWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Official Acadiana Flag Crimson Field (Bottom-Right Half: Gold Castle of Castile) -->
    <linearGradient id="acadianaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#c81d25" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Spanish Castle Gold Gradient -->
    <linearGradient id="castileGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Reusable Crisp White Fleur-de-lis Symbol with Petals -->
    <g id="fleurDeLis">
      <!-- Central Petal -->
      <path d="M0 -18 C4.5 -11, 5.5 -4, 0 5 C-5.5 -4, -4.5 -11, 0 -18 Z" fill="#ffffff" />
      <!-- Left Curling Petal -->
      <path d="M-1.5 1 C-6 -7, -14 -7, -14 0 C-14 4.5, -10 6.5, -7.5 4 C-9.5 3.5, -9.5 0.5, -7 0 C-4.5 -0.5, -3 2, -2 5 Z" fill="#ffffff" />
      <!-- Right Curling Petal -->
      <path d="M1.5 1 C6 -7, 14 -7, 14 0 C14 4.5, 10 6.5, 7.5 4 C9.5 3.5, 9.5 0.5, 7 0 C4.5 -0.5, 3 2, 2 5 Z" fill="#ffffff" />
      <!-- Horizontal Band -->
      <rect x="-7.5" y="4.2" width="15" height="2.8" rx="1.2" fill="#ffffff" />
      <!-- Lower Stem Base -->
      <path d="M-3.5 7 L3.5 7 L5.5 13.5 L0 11 L-5.5 13.5 Z" fill="#ffffff" />
    </g>

    <!-- Dynamic Gulf Surf Wave Gradient -->
    <linearGradient id="gulfWaveBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Inside Barrel Shadow -->
    <linearGradient id="waveHollowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Crest Foam & Spray Gradient -->
    <linearGradient id="crestFoam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Outer Nautical Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Heraldic Drop Shadow -->
    <filter id="heraldicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Dark Backing Plate -->
  <circle cx="50" cy="50" r="49" fill="#040d1a" />

  <!-- Clipped Heraldic Acadiana Flag & Gulf Wave Interior -->
  <g clip-path="url(#emblemClip)">
    <!-- =================================================================
         1. TOP-RIGHT HALF: Royal Blue Field with 3 White Fleurs-de-lis
         ================================================================= -->
    <rect x="0" y="0" width="100" height="50" fill="url(#acadianaBlue)" />

    <!-- Three White Fleurs-de-lis in Official 2-over-1 Pattern (Well-Clear of Rim) -->
    <g id="fleursDeLisCluster" filter="url(#heraldicShadow)">
      <!-- Top-Left Fleur-de-lis -->
      <use href="#fleurDeLis" transform="translate(54, 21.5) scale(0.40)" />
      <!-- Top-Right Fleur-de-lis -->
      <use href="#fleurDeLis" transform="translate(68.5, 21.5) scale(0.40)" />
      <!-- Bottom-Center Fleur-de-lis -->
      <use href="#fleurDeLis" transform="translate(61.25, 34.5) scale(0.40)" />
    </g>

    <!-- =================================================================
         2. BOTTOM-RIGHT HALF: Crimson Red Field with Gold Castle of Castile
         ================================================================= -->
    <rect x="0" y="50" width="100" height="50" fill="url(#acadianaRed)" />

    <!-- Clean Horizontal Seam Line between Blue and Red Fields -->
    <line x1="50" y1="50" x2="100" y2="50" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35" />

    <!-- Spanish Gold Castle of Castile (Unified Sharp Vector Keep & 3 Crenellated Turrets) -->
    <g id="castleOfCastile" transform="translate(64, 64.5) scale(0.78)" filter="url(#heraldicShadow)">
      <!-- Unified Keep and 3 Battlements Towers / Turrets -->
      <path
        d="M-15 14 L15 14 L15 11 L13 11 L13 -1 L13.5 -1 L13.5 -7.5 L14.2 -7.5 L14.2 -10 L12.1 -10 L12.1 -7.5 L10.8 -7.5 L10.8 -10 L8.7 -10 L8.7 -7.5 L7.4 -7.5 L7.4 -10 L5.3 -10 L5.3 -7.5 L6 -7.5 L6 -1 L4 -1 L4 -13.5 L4.8 -13.5 L4.8 -16.5 L2.5 -16.5 L2.5 -13.5 L1.15 -13.5 L1.15 -16.5 L-1.15 -16.5 L-1.15 -13.5 L-2.5 -13.5 L-2.5 -16.5 L-4.8 -16.5 L-4.8 -13.5 L-4 -13.5 L-4 -1 L-6 -1 L-6 -7.5 L-5.3 -7.5 L-5.3 -10 L-7.4 -10 L-7.4 -7.5 L-8.7 -7.5 L-8.7 -10 L-10.8 -10 L-10.8 -7.5 L-12.1 -7.5 L-12.1 -10 L-14.2 -10 L-14.2 -7.5 L-13.5 -7.5 L-13.5 -1 L-13 -1 L-13 11 L-15 11 Z"
        fill="url(#castileGold)"
      />
      <!-- Castle Arched Gateway Portal -->
      <path d="M-3.2 14 L-3.2 7.5 A3.2 3.2 0 0 1 3.2 7.5 L3.2 14 Z" fill="#991b1b" />
      <!-- Tower Windows -->
      <rect x="-10.5" y="-5" width="1.6" height="3" rx="0.5" fill="#991b1b" />
      <rect x="8.9" y="-5" width="1.6" height="3" rx="0.5" fill="#991b1b" />
      <rect x="-0.8" y="-10.5" width="1.6" height="3.5" rx="0.5" fill="#991b1b" />
    </g>

    <!-- =================================================================
         3. LEFT HOIST CHEVRON: White Triangle with Centered Gold Star -->
    <polygon points="0,-2 50,50 0,102" fill="url(#acadianaWhite)" />
    <polyline points="0,-2 50,50 0,102" fill="none" stroke="#cbd5e1" stroke-width="0.9" />

    <!-- Gold 5-Pointed Star of Our Lady of the Assumption (Stella Maris) -->
    <g id="stellaMarisStar" transform="translate(24.5, 50)" filter="url(#heraldicShadow)">
      <polygon
        points="0,-10.5 2.36,-3.25 9.99,-3.24 3.82,1.24 6.17,8.50 0,4.01 -6.17,8.50 -3.82,1.24 -9.99,-3.24 -2.36,-3.25"
        fill="url(#starGold)"
        stroke="#ca8a04"
        stroke-width="0.5"
        stroke-linejoin="round"
      />
    </g>

    <!-- =================================================================
         4. FOREGROUND BOTTOM RIM: Authentic Curling Gulf Surf Wave Crest
         ================================================================= -->
    <!-- Swell Body with Rising Shoulder and Pitching Curl Lip -->
    <path
      d="M 10 92 C 26 86, 42 86, 56 84 C 68 82, 75 79, 82 76 C 86 74, 90 77, 92 82 C 88 85, 82 85, 78 82 C 72 78, 64 77, 60 82 C 56 87, 60 92, 68 91 C 76 90, 84 94, 92 98 L 92 100 L 10 100 Z"
      fill="url(#gulfWaveBody)"
    />
    <!-- Deep Inside Barrel Tube / Hollow Shadow -->
    <path
      d="M 58 84 C 64 78, 74 79, 78 82 C 75 87, 66 89, 60 86 C 58 85, 57 84, 58 84 Z"
      fill="url(#waveHollowDark)"
      opacity="0.92"
    />
    <!-- Bright White/Cyan Breaking Foam Lip & Spray Crest -->
    <path
      d="M 10 92 C 28 85, 44 85, 58 83 C 68 81, 75 78, 82 76 C 85 75, 87 77, 86 80 C 82 82, 77 81, 74 78 C 68 76, 61 78, 58 83 C 46 85, 30 87, 10 94 Z"
      fill="url(#crestFoam)"
    />
  </g>

  <!-- Outer Crisp Gold/Cyan Nautical Bezel Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#rimGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="43.8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.7" />
</svg>
